<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1113" />
    <title>FGC Calistenia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=8" />
  </head>
  <body>
    <div id="app" class="app"><div class="boot">Cargando…</div></div>

    <!--
      Librería de Supabase (solo se usa en producción).
      Si estás en modo demo o sin internet, la app funciona igual.
    -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

    <!-- Configuración local opcional (no se versiona). Ver README. -->
    <script src="config.local.js" onerror="void 0"></script>

    <!--
      Código de la app (el orden importa).
      El ?v=N fuerza al navegador a bajar la versión nueva y no usar la cacheada.
      Al publicar cambios en estos archivos, subí el número (v2 → v3, etc.).
    -->
    <script src="js/config.js?v=8"></script>
    <script src="js/seed.js?v=8"></script>
    <script src="js/store.js?v=8"></script>
    <script src="js/ui.js?v=8"></script>
    <script src="js/auth.js?v=8"></script>
    <script src="js/app.js?v=8"></script>
  </body>
</html>
